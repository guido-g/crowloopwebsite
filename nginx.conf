server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long-lived caching for hashed/static assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — required because the app uses client-side routing
    # (BrowserRouter with paths like /en/portfolio). Without this,
    # a direct visit or reload on any non-root path 404s at the server
    # before React Router ever sees the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
