server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects are built from the request, not from nginx's own idea of the host, so they
    # stay correct behind a proxy or load balancer.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Build-hashed, so the name changes whenever the bytes do. `^~` keeps this ahead of the
    # media regex below, which would otherwise capture hashed font files and cache them less.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images and fonts served from public/ are not hashed, but they change rarely.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Everything else is an HTML document (or robots/sitemap). Prerendered pages reference
    # build-hashed asset filenames that disappear on the next deploy, so a browser reusing a
    # cached page would request JS and CSS that no longer exist. Revalidating costs little —
    # the documents are a few kB.
    location / {
        add_header Cache-Control "no-cache";

        # $uri.html serves the prerendered page for a clean, trailing-slash-free URL
        # (scripts/prerender.mjs). $uri/ and the /index.html fallback keep client-side
        # routing working for `/` and any path without a prerendered file.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
