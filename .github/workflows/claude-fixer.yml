name: Maintenance fixer

# Autonomous "fixer" half of the maintenance loop.
#
# The scout (running on a schedule in Claude/Cowork) files tickets into the orboto
# project CLW. This workflow picks up the top ticket, fixes it, proves the fix builds,
# and then either merges it (content-only changes) or leaves a PR for a human.
#
# The merge gate is enforced mechanically in the "Risk gate" step below - it inspects the
# actual diff, not the model's opinion of the diff. Claude cannot merge past it.

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours, off the hour to avoid the scheduling stampede
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Specific CLW ticket key to work (optional, e.g. CLW-12)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maintenance-fixer
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name  "crowloop-maintenance-bot"
          git config user.email "noreply@anthropic.com"

      # Writing the MCP config to a file (instead of passing it as inline JSON inside
      # claude_args) sidesteps a real failure mode: claude_args is a YAML folded scalar
      # that gets handed to a shell, and that shell strips the double quotes out of an
      # inline {"mcpServers":...} blob. The mangled, no-longer-valid-JSON string then
      # gets treated by the Claude CLI as a *file path* instead - normalizing the "//" in
      # the URL along the way - and fails with "MCP config file not found". A file path
      # in claude_args has no quotes to lose, so it can't happen here.
      - name: Write orboto MCP config
        env:
          ORBOTO_MCP_URL: ${{ vars.ORBOTO_MCP_URL }}
          ORBOTO_API_KEY: ${{ secrets.ORBOTO_API_KEY }}
        run: |
          cat > "$RUNNER_TEMP/orboto-mcp.json" <<EOF
          {"mcpServers":{"orboto":{"type":"http","url":"$ORBOTO_MCP_URL","headers":{"Authorization":"Bearer $ORBOTO_API_KEY"}}}}
          EOF

      - name: Run fixer
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,mcp__orboto"
            --mcp-config ${{ runner.temp }}/orboto-mcp.json
          prompt: |
            You are the maintenance fixer for crowloop.studio. You work ONE ticket per run.

            Project: React + TypeScript + Vite marketing site, bilingual EN/DE via
            react-i18next, deployed by AWS Amplify from `master`. Merging to master
            deploys to production. There is NO test suite - the build is the safety net.

            Requested ticket (may be empty, meaning "pick the top one"): "${{ inputs.ticket }}"

            HOW TO LABEL A TICKET (you will need this below)
            orboto_update_ticket CANNOT set labels - it has no labels field. Use
            orboto_api_call instead:
              GET  /projects/{projectId}/labels                  -> find the label id by name
              POST /projects/tickets/{ticketId}/labels/{labelId} -> apply it
            The label must already exist in the project. This account cannot create one
            (that needs project:edit, which the service-account role does not carry). If
            `needs-human` does not exist, say so explicitly in your ticket comment rather
            than silently skipping it - an unlabelled ticket looks like an unreviewed one.

            STEP 1 - PICK THE TICKET
            Call orboto_session_start, then orboto_get_project_primer("CLW").
            If a ticket key was requested above, work that one. Otherwise list open CLW
            tickets, skip any labelled `needs-human`, and take the
            highest priority one (blocker > high > normal > low > trivial; oldest first
            on ties). If there is nothing to work on, write
            {"action":"none"} to "$RUNNER_TEMP/fixer-result.json" and stop immediately.

            STEP 2 - CONFIRM IT IS REAL
            Reproduce or verify the problem in this checkout before changing anything.
            Read the actual files. If the ticket turns out to be stale, already fixed,
            a duplicate or out of scope, comment on it explaining exactly what you
            checked, then resolve it as `wont_fix` - NOT `done`. Workspace rules reserve
            `done` for work that was actually carried out; duplicate, superseded and
            no-longer-applicable tickets are `wont_fix`, because closing them as done
            falsifies burndown and velocity. Then write {"action":"none"} to
            "$RUNNER_TEMP/fixer-result.json" and stop.

            STEP 3 - CLAIM IT, THEN FIX IT
            Claim the ticket first - workspace rules require claiming before touching
            code - using orboto_claim with noTimer: true.

            NEVER start a timer, here or anywhere else in this run. Automated CI runs are
            machine time, not billable work, and this workspace does not track them. The
            hazard is concrete: a run that crashes or is cancelled leaves a timer running,
            which silently inflates the ticket and then gets re-attributed to whatever is
            claimed next. If you somehow find a timer running under this account, stop it
            before doing anything else.

            Then make the smallest correct change. Do not refactor, do not reformat
            unrelated code, do not bump dependencies unless the ticket is specifically
            about that. Work on a new branch named `fix/<TICKET-KEY>-<short-slug>`.

            STEP 4 - PROVE IT
            Run, in order, and do not proceed if any of them fail:
              npm run lint
              npm run build
            `npm run build` typechecks, bundles the client and the SSR entry, prerenders
            every route and emits the sitemap. If it fails, DO NOT commit. Instead:
            comment on the ticket explaining exactly what you tried and why it failed,
            label it `needs-human`, hand it back by moving it out of in_progress to its
            todo status and unassigning yourself (leaving it claimed by a bot that isn't
            working on it makes the board lie), then write {"action":"none"} to
            "$RUNNER_TEMP/fixer-result.json" and stop.

            STEP 5 - COMMIT AND PUSH
            Commit only the files your fix actually needed. One ticket = one commit.

            The commit subject MUST follow the workspace convention exactly:
              type(scope): short description (TICKET-KEY)
            with the ticket key in parentheses at the END of the subject, e.g.
              fix(i18n): add missing DE key for contact form label (CLW-7)
            orboto's git parser links commits to tickets by that trailing key - get the
            format wrong and the commit never shows up on the ticket.

            Then a blank line, then why the change was needed (not what it does - the
            diff already says what). End the message with:
              Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
            Push the branch immediately after committing.

            Write everything - commit message, ticket comments - in English, the
            workspace language.

            STEP 6 - HAND OFF
            Write "$RUNNER_TEMP/fixer-result.json" containing exactly:
              {"action":"fixed","ticket":"<TICKET-KEY>","branch":"<branch name>",
               "title":"<one line PR title>","risk":"content|code",
               "summary":"<2-4 sentences: what was wrong, what you changed, how you verified>"}
            Set "risk" to "content" ONLY if every changed file is copy, translations,
            SEO metadata, documentation or image assets. Any change to application logic,
            configuration, dependencies, the Amplify backend or build scripts is "code".
            When in doubt use "code" - a human will look at it, which costs nothing.

            A later step decides whether this merges. Do not open or merge a pull request
            yourself, and never push to master.

      - name: Read fixer result
        id: result
        run: |
          f="$RUNNER_TEMP/fixer-result.json"
          if [ ! -f "$f" ]; then
            echo "No result file written - treating as no-op."
            echo "action=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cat "$f"
          for k in action ticket branch title risk summary; do
            v=$(node -e "try{const r=require('$f');process.stdout.write(String(r.$k??''))}catch(e){}")
            printf '%s<<__EOF__\n%s\n__EOF__\n' "$k" "$v" >> "$GITHUB_OUTPUT"
          done

      # ---------------------------------------------------------------------------
      # Mechanical merge gate. This inspects the real diff. Claude's own "risk" field
      # can only ever DOWNGRADE to review - it can never grant a merge on its own.
      # ---------------------------------------------------------------------------
      - name: Risk gate
        id: gate
        if: steps.result.outputs.action == 'fixed'
        env:
          # Everything Claude produced enters the shell as data, never as script text.
          BRANCH: ${{ steps.result.outputs.branch }}
          SELF_RISK: ${{ steps.result.outputs.risk }}
        run: |
          set -uo pipefail
          git fetch origin master "$BRANCH"

          files=$(git diff --name-only "origin/master..origin/$BRANCH")
          added=$(git diff --numstat "origin/master..origin/$BRANCH" | awk '{s+=$1+$2} END {print s+0}')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "Changed files ($count files, $added lines):"
          printf '%s\n' "$files"

          # Paths considered content. Everything else requires a human.
          ALLOW='^(src/i18n/locales/|public/|assets/|docs/|src/seo/meta\.ts$|.*\.md$)'
          # Never auto-merged even if some allowlist pattern would match. `.github/` is
          # here so the fixer can never quietly widen its own guard rails.
          DENY='(^|/)\.\.(/|$)|^\.github/|^amplify|^scripts/|^package(-lock)?\.json$|^Dockerfile|^nginx\.conf$|\.config\.(ts|js|mjs)$|^tsconfig'

          verdict=auto
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if printf '%s\n' "$f" | grep -qE "$DENY"; then
              echo "  -> '$f' is on the never-auto-merge denylist"
              verdict=review
            elif ! printf '%s\n' "$f" | grep -qE "$ALLOW"; then
              echo "  -> '$f' is outside the content allowlist"
              verdict=review
            fi
          done <<< "$files"

          # Size guards: a large "content" change still deserves a pair of eyes.
          if [ "$count" -gt 5 ]; then
            echo "  -> touches $count files (>5)"; verdict=review
          fi
          if [ "$added" -gt 120 ]; then
            echo "  -> changes $added lines (>120)"; verdict=review
          fi
          if [ "$SELF_RISK" != "content" ]; then
            echo "  -> fixer self-classified as '$SELF_RISK'"; verdict=review
          fi

          echo "VERDICT: $verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.result.outputs.action == 'fixed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.result.outputs.branch }}
          TITLE: ${{ steps.result.outputs.title }}
          SUMMARY: ${{ steps.result.outputs.summary }}
          TICKET: ${{ steps.result.outputs.ticket }}
        run: |
          set -uo pipefail
          body=$(printf '%s\n\nTicket: %s\nVerified with `npm run lint` and `npm run build` (typecheck, both bundles, prerender, sitemap).\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n' "$SUMMARY" "$TICKET")
          url=$(gh pr create --base master --head "$BRANCH" --title "$TITLE" --body "$body")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: Auto-merge (content-only changes)
        if: steps.gate.outputs.verdict == 'auto'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
          echo "Merged - Amplify will deploy from master."

      - name: Flag for human review
        if: steps.gate.outputs.verdict == 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr edit "$PR_URL" --add-label "needs-human" || true
          echo "::notice::Left open for review: $PR_URL"

      - name: Report back to the ticket
        if: steps.result.outputs.action == 'fixed'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "mcp__orboto"
            --mcp-config ${{ runner.temp }}/orboto-mcp.json
          prompt: |
            Update orboto ticket ${{ steps.result.outputs.ticket }} with the outcome of an
            automated fix. Do not change any other ticket.

            Outcome: ${{ steps.gate.outputs.verdict }}
            ("auto" = merged to master and deploying; "review" = PR open, awaiting a human)
            Pull request: ${{ steps.pr.outputs.url }}
            What was done: ${{ steps.result.outputs.summary }}

            Post that as a comment on the ticket. Then:
            - if the outcome was "auto": the change was verified (lint + full build:
              typecheck, both bundles, prerender of every route, sitemap), merged to
              master and is deploying. Close the ticket with orboto_close_ticket, and in
              the closing comment state explicitly HOW each acceptance criterion was
              verified and link the PR - workspace rules require that a closing comment
              stands on its own to a reviewer reading it cold. If the ticket had
              acceptance criteria that the build alone does NOT prove, do not close it:
              leave it open, say which criterion is unproven, and label it `needs-human`.
            - if the outcome was "review": leave the ticket open and label it
              `needs-human`. Do not close it.
